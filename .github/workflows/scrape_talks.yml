name: Validate Academic Site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check reproducible frontend bundle
        run: |
          npm ci --ignore-scripts
          npm run build:js
          git diff --exit-code -- assets/js/main.min.js

      - name: Set up Ruby and locked dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check analytics consent state transitions
        run: node scripts/test_analytics_consent.mjs

      - name: Check retired tool execution guards
        run: python3 -B scripts/test_legacy_archives.py

      - name: Check deterministic presentation map
        run: python3 talkmap.py --check

      - name: Build production site
        run: bundle exec jekyll build --trace

      - name: Check links, scholarly metadata, and unpublished content
        run: python3 scripts/validate_site.py _site
